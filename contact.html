<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div class="container">
        <h1>Contact Me</h1>

        <p>
            <a href="index.html">Home</a> &mdash;
            <a href="projects.html">Projects</a> &mdash;
            <a href="contact.html">Contact</a>
        </p>

        <p>The best way to reach me is through email or LinkedIn. Let's connect! Please use the form below.</p>

        <form id="contactForm">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" style="width: 100%; padding: 8px; margin-bottom: 10px; height: 100px;"></textarea><br>
            
            <button type="submit" style="background-color: #FFBF00; color: royalblue; padding: 10px 20px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px;">Send Message</button>
            
            <p id="validationMessage" style="font-weight: bold; margin-top: 10px;"></p>
        </form>
        <h2>Other Links</h2>

        </ul>
